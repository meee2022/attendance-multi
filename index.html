<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>نظام الغياب المدرسي</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@200..1000&family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Cairo', sans-serif;
      }
    </style>
    <script>
      // Some school networks serve a stale page whose stylesheet no longer
      // exists, so the app shows unstyled. Reload once, bypassing the cache.
      window.addEventListener("load", function () {
        setTimeout(function () {
          var styled = getComputedStyle(document.documentElement).getPropertyValue("--gradient-primary").trim();
          if (styled) { try { sessionStorage.removeItem("css_retry"); } catch (e) {} return; }
          try { if (sessionStorage.getItem("css_retry")) return; sessionStorage.setItem("css_retry", "1"); } catch (e) { return; }
          var u = new URL(location.href); u.searchParams.set("r", Date.now()); location.replace(u.toString());
        }, 1500);
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
